<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Relist</title>
    <style>
      body { font: 13px system-ui, -apple-system, sans-serif; padding: 12px; width: 300px; }
      label { display: block; margin-top: 10px; font-weight: 500; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; }
      button { margin-top: 12px; padding: 6px 10px; }
      .row { display: flex; gap: 6px; }
      .status { margin-top: 10px; font-size: 12px; color: #666; min-height: 16px; }
      .ok { color: #116329; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h3 style="margin:0">Relist</h3>
    <label>API base URL
      <input id="apiBase" type="url" placeholder="https://your-relist.vercel.app" />
    </label>
    <label>API key
      <input id="apiKey" type="password" placeholder="rk_…" />
    </label>
    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test</button>
    </div>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
